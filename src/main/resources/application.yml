server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: marketplace-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB

  # ─── Database ───────────────────────────────────────────
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace}${DB_SSL_PARAM:}}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1200000}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  # ─── Flyway ─────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    schemas:
      - public
      - identity_schema
      - catalog_schema
      - inventory_schema
      - order_schema
      - payment_schema
      - cart_schema
      - shipping_schema
      - delivery_schema
      - warehouse_schema
      - seller_schema
      - finance_schema
      - support_schema
      - notification_schema
      - review_schema
      - promotion_schema
      - fraud_schema
      - audit_schema

  # ─── Redis ──────────────────────────────────────────────
  data:
    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  # ─── Kafka ──────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
      auto-create: false
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:org.apache.kafka.common.security.plain.PlainLoginModule required username="" password="";}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: marketplace-backend
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.ecommerce.marketplace.*

  # ─── Jackson ────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # ─── Mail (for future use) ──────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

# ─── Application Configuration ──────────────────────────────
app:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  shedlock:
    enabled: ${SHEDLOCK_ENABLED:false}
  # JWT
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-must-be-at-least-32-chars}
    access-token-expiry-ms: 900000     # 15 minutes
    refresh-token-expiry-ms: 604800000 # 7 days

  # OTP
  otp:
    length: 6
    expiry-minutes: 5
    max-attempts: 3
    max-requests-per-hour: 5
    resend-cooldown-seconds: 30
    test-phone: ${OTP_TEST_PHONE:9999999999}
    test-otp: ${OTP_TEST_OTP:123456}

  # Razorpay
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

  # Cloudinary
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

  # Ping4SMS (OTP via SMS)
  ping4sms:
    base-url: ${PING4SMS_BASE_URL:https://site.ping4sms.com/api/smsapi}
    api-key: ${PING4SMS_API_KEY:}
    sender-id: ${PING4SMS_SENDER_ID:PNGOTP}
    sms-route: ${PING4SMS_SMS_ROUTE:2}
    dlt-template-id: ${PING4SMS_DLT_TEMPLATE_ID:1507165967974501361}

  # Meta WhatsApp Business API
  whatsapp:
    access-token: ${META_WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${META_WHATSAPP_PHONE_NUMBER_ID:1256462174221610}
    template-name: ${META_WHATSAPP_TEMPLATE_NAME:pginfo_login_otp}
    template-lang: ${META_WHATSAPP_TEMPLATE_LANG:en_US}

  # Google Maps
  google-maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

  # Inventory
  inventory:
    reservation-expiry-minutes: 10
    reservation-cleanup-interval-ms: 30000

  # CORS
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.onrender.com,https://*.vercel.app,http://localhost:*,https://localhost:*}

# ─── Actuator ─────────────────────────────────────────────
management:
  health:
    kafka:
      enabled: ${app.kafka.enabled:false}
    redis:
      enabled: ${app.redis.health.enabled:false}
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# ─── OpenAPI / Swagger ────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ─── Logging ──────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.ecommerce.marketplace: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.apache.kafka: WARN
    org.apache.kafka.clients.NetworkClient: ERROR
    net.javacrumbs.shedlock: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"

---
# ─── Development Profile ─────────────────────────────────
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
  flyway:
    enabled: true

app:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  shedlock:
    enabled: ${SHEDLOCK_ENABLED:false}

server:
  error:
    include-message: always
    include-binding-errors: always

---
# ─── Production Profile ──────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

server:
  error:
    include-message: never
    include-binding-errors: never

app:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  shedlock:
    enabled: ${SHEDLOCK_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-must-be-at-least-32-chars}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  level:
    root: INFO
    com.ecommerce.marketplace: ${LOG_LEVEL:INFO}
    org.apache.kafka.clients.NetworkClient: ERROR
    org.apache.kafka: WARN
    net.javacrumbs.shedlock: WARN
